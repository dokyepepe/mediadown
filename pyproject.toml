[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader-desktop"
dynamic = ["version"]
description = "Utilitário desktop para download e conversão de mídias"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "packaging>=24,<27",
  "PySide6>=6.8,<7",
  "platformdirs>=4.3,<5",
  "yt-dlp[default]>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "Pillow>=11,<13",
  "PyInstaller>=6.11,<7",
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
]

[project.scripts]
media-downloader = "mediadownloader.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "mediadownloader.version.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
