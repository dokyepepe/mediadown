<svg xmlns="http://www.w3.org/2000/svg" width="412" height="820" viewBox="0 0 412 820">
  <title>Media Downloader em layout compacto</title>
  <desc>Mockup ilustrativo da tela inicial após analisar uma mídia, com navegação inferior.</desc>
  <rect width="412" height="820" fill="#F5F6F7"/>
  <rect width="412" height="52" fill="#FFFFFF"/>
  <g transform="translate(15 14) scale(.95)" fill="none" stroke="#257349" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/><path d="m17.5 4.5 3 2-3 2z" fill="#257349" stroke="none"/></g>
  <text x="45" y="32" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#257349">Media Downloader</text>
  <text x="364" y="31" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">v1.1.0</text>
  <line y1="52" x2="412" y2="52" stroke="#DADDE1"/>

  <rect x="16" y="72" width="40" height="40" rx="9" fill="#E7F3EC" stroke="#DADDE1"/>
  <path d="M27 90l9-8 9 8v11H27z" fill="none" stroke="#257349" stroke-width="2"/>
  <text x="68" y="91" font-family="Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#252525">Baixar mídia</text>
  <text x="68" y="109" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">Cole o link de um vídeo, áudio ou playlist.</text>

  <rect x="16" y="132" width="380" height="46" rx="7" fill="#FFFFFF" stroke="#DADDE1"/>
  <circle cx="34" cy="155" r="7" fill="none" stroke="#7A7F84" stroke-width="1.5"/>
  <path d="M28 155h12M34 149c3 3 3 9 0 12M34 149c-3 3-3 9 0 12" fill="none" stroke="#7A7F84"/>
  <text x="49" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#61676C">https://exemplo.com/video</text>
  <rect x="16" y="187" width="122" height="42" rx="7" fill="#FFFFFF" stroke="#DADDE1"/>
  <text x="57" y="213" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#252525">COLAR</text>
  <rect x="146" y="187" width="250" height="42" rx="7" fill="#257349"/>
  <text x="236" y="213" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF">ANALISAR</text>

  <rect x="16" y="244" width="380" height="236" rx="9" fill="#FFFFFF" stroke="#DADDE1"/>
  <rect x="86" y="258" width="240" height="135" rx="7" fill="#E7EAEC"/>
  <path d="M191 300l42 25-42 25z" fill="#257349" opacity=".9"/>
  <text x="30" y="423" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650" fill="#252525">Prévia da mídia</text>
  <text x="30" y="447" font-family="Segoe UI, sans-serif" font-size="13" fill="#666">Canal do autor</text>
  <text x="30" y="467" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">YouTube  •  04:32</text>

  <rect x="16" y="494" width="380" height="171" rx="9" fill="#FFFFFF" stroke="#DADDE1"/>
  <text x="30" y="524" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650" fill="#252525">Tipo de download</text>
  <rect x="232" y="507" width="70" height="34" rx="6" fill="#DDEFE5" stroke="#257349"/>
  <text x="247" y="529" font-family="Segoe UI, sans-serif" font-size="11" font-weight="650" fill="#257349">VÍDEO</text>
  <rect x="310" y="507" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#DADDE1"/>
  <text x="325" y="529" font-family="Segoe UI, sans-serif" font-size="11" fill="#252525">ÁUDIO</text>
  <text x="30" y="565" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">QUALIDADE</text>
  <text x="211" y="565" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">FORMATO</text>
  <rect x="30" y="574" width="163" height="42" rx="6" fill="#FFFFFF" stroke="#DADDE1"/>
  <text x="42" y="600" font-family="Segoe UI, sans-serif" font-size="11" fill="#252525">Melhor disponível</text>
  <rect x="211" y="574" width="169" height="42" rx="6" fill="#FFFFFF" stroke="#DADDE1"/>
  <text x="223" y="600" font-family="Segoe UI, sans-serif" font-size="12" fill="#252525">MP4</text>
  <text x="30" y="642" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">A melhor combinação será selecionada.</text>

  <rect x="16" y="680" width="380" height="46" rx="7" fill="#257349"/>
  <text x="177" y="709" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF">BAIXAR</text>

  <rect y="742" width="412" height="78" fill="#FFFFFF"/>
  <line y1="742" x2="412" y2="742" stroke="#DADDE1"/>
  <rect x="4" y="747" width="80" height="67" rx="8" fill="#E7F3EC"/>
  <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">
    <text x="44" y="778" font-size="20" fill="#257349">⌂</text><text x="44" y="800" font-weight="650" fill="#257349">Início</text>
    <text x="125" y="778" font-size="18" fill="#666">⇩</text><text x="125" y="800" fill="#666">Downloads</text>
    <text x="206" y="778" font-size="18" fill="#666">◷</text><text x="206" y="800" fill="#666">Histórico</text>
    <text x="287" y="778" font-size="18" fill="#666">⚙</text><text x="287" y="800" fill="#666">Ajustes</text>
    <text x="368" y="778" font-size="18" fill="#666">ⓘ</text><text x="368" y="800" fill="#666">Sobre</text>
  </g>
</svg>

